name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Used only to satisfy env parsing during `next build`.
  # All data routes are dynamic, so no DB connection happens at build time.
  DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=require

jobs:
  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  deploy:
    # The caveat is in the job name on purpose. The gate below can no-op when
    # VERCEL_* secrets are absent, and a job that reports success while doing
    # nothing is indistinguishable from one that deployed — which is how two
    # commits reached main with nothing going live.
    name: Deploy to Vercel (skipped unless VERCEL_* secrets are set)
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel secrets
        id: gate
        run: |
          missing=""
          if [ -z "$VERCEL_TOKEN" ]; then missing="$missing VERCEL_TOKEN"; fi
          if [ -z "$VERCEL_ORG_ID" ]; then missing="$missing VERCEL_ORG_ID"; fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then missing="$missing VERCEL_PROJECT_ID"; fi
          if [ -n "$missing" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            # Non-failing, but impossible to miss: an annotation on the run and a
            # block on its summary. Silence here is what let main drift ahead of
            # production unnoticed, so the skip says so rather than just logging.
            echo "::warning title=Production deploy skipped::Missing repository secrets:$missing. CI is green but vercel deploy --prod did not run, so production is still serving an older commit than main."
            {
              echo "### :warning: Production deploy skipped"
              echo
              echo "Not set on this repository: \`$missing\`"
              echo
              echo "CI passed, but \`vercel deploy --prod\` never ran. **Production is serving an older commit than \`main\`.**"
              echo
              echo "Set them under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.should_deploy == 'true'
        uses: actions/checkout@v4

      - name: Deploy to production
        if: steps.gate.outputs.should_deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

  # Netlify alternative — enable by uncommenting, adding a NETLIFY_* gate step
  # (mirroring the Vercel gate above), and removing the Vercel deploy job.
  #
  # deploy-netlify:
  #   name: Deploy to Netlify
  #   needs: ci
  #   if: github.ref == 'refs/heads/main'
  #   runs-on: ubuntu-latest
  #   env:
  #     NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  #     NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: jsmrcaga/action-netlify-deploy@v2.3.0
  #       with:
  #         NETLIFY_AUTH_TOKEN: ${{ env.NETLIFY_AUTH_TOKEN }}
  #         NETLIFY_SITE_ID: ${{ env.NETLIFY_SITE_ID }}
  #         install_command: npm ci
  #         build_command: npm run build